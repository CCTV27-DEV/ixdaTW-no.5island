<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今天的你是哪一種魚</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet"
      media="print" onload="this.media='all'">   <!-- 非阻塞：首次繪製不等字型 -->
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --ink:#e7f6f3; --sub:#9fc7c3; --deep:#5fe1d1; --foam:#0c333c; --mid:#04161d; --sand:#0a2a30;
  --tint:#020c10; --line:rgba(231,246,243,.16); --glass:rgba(8,30,36,.55);
  --serif:"Noto Serif TC",Songti TC,serif;
  --sans:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans); color:var(--ink);
  background:linear-gradient(180deg,var(--foam) 0%,var(--mid) 55%,var(--tint) 100%);
  overflow:hidden; overscroll-behavior:none;
  transition:background 1.4s ease;
}
.stage{position:fixed;inset:0;overflow:hidden;z-index:1}
.page{position:absolute;inset:0;display:none}
.page.on{display:block}

/* ---- ambience: rays / current / bubbles ---- */
.ambience{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.rays{position:absolute;inset:-10% -10% auto -10%;height:120%;mix-blend-mode:screen;opacity:.6;filter:blur(6px)}
.ray{
  position:absolute;top:-15%;width:14vw;min-width:120px;height:130%;
  background:linear-gradient(180deg,rgba(200,245,238,.16),rgba(200,245,238,0) 72%);
  transform-origin:top center;filter:blur(18px);
  animation:swayRay 14s ease-in-out infinite;
}
@keyframes swayRay{0%,100%{transform:rotate(var(--rot1,6deg)) translateX(0)}50%{transform:rotate(var(--rot2,2deg)) translateX(2vw)}}
.current{
  position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;
  background:radial-gradient(circle,rgba(95,225,209,.22),rgba(95,225,209,0) 68%);
  animation:driftCurrent linear infinite;
}
.currents{position:absolute;inset:0}
.bubbles{position:absolute;inset:0}
@keyframes driftCurrent{0%{transform:translate(-10%,0)}50%{transform:translate(10%,-4%)}100%{transform:translate(-10%,0)}}
.bubble{
  position:absolute;bottom:-8%;border-radius:50%;
  border:1px solid rgba(220,248,244,.35);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.45),rgba(255,255,255,.03) 60%);
  opacity:0;animation:riseBubble linear infinite;
}
@keyframes riseBubble{
  0%{transform:translate(0,0);opacity:0}
  8%{opacity:.55}
  50%{transform:translate(var(--sway,14px),-55vh)}
  92%{opacity:.4}
  100%{transform:translate(0,-112vh);opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .ray,.current,.bubble{animation:none;opacity:.15}
}

/* ---- home ---- */
#home{display:none;place-items:center;text-align:center;padding:24px;position:absolute;z-index:2}
#home.on{display:grid}
.home-in{max-width:32rem;width:100%;margin:0 auto;text-align:center}
.ask{font-family:var(--serif);font-weight:700;font-size:clamp(1.6rem,6.5vw,2.6rem);line-height:1.45;letter-spacing:.04em;
  color:var(--ink);text-shadow:0 0 28px rgba(95,225,209,.25);text-align:center}
.sub{margin-top:.9rem;font-size:.9rem;letter-spacing:.12em;color:var(--sub);text-align:center}
.loadnote{margin-top:1.3rem;font-size:.78rem;letter-spacing:.14em;color:var(--sub);
  opacity:0;transition:opacity .5s;pointer-events:none}
body.loading .loadnote{opacity:.85}
body.loading .mood{opacity:.5}
.moods{margin-top:2.6rem;display:flex;gap:clamp(.4rem,3vw,1.4rem);justify-content:center;align-items:center;flex-wrap:wrap;width:100%}
.mood{
  font-size:clamp(2.1rem,10vw,3rem);line-height:1;cursor:pointer;
  width:clamp(64px,19vw,92px);height:clamp(64px,19vw,92px);display:grid;place-items:center;
  border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.08);
  backdrop-filter:blur(6px);
  transition:transform .25s cubic-bezier(.2,.9,.3,1.3),background .25s,box-shadow .25s;
}
.mood:hover,.mood:focus-visible{transform:translateY(-6px) scale(1.06);background:rgba(255,255,255,.16);box-shadow:0 10px 30px rgba(95,225,209,.22);outline:none}
.mood:focus-visible{outline:2px solid var(--deep);outline-offset:3px}

/* ---- school ---- */
.hint{
  position:absolute;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);
  font-size:.82rem;letter-spacing:.18em;color:var(--sub);background:var(--glass);backdrop-filter:blur(6px);
  padding:.5rem 1rem;border-radius:999px;white-space:nowrap;z-index:5;border:1px solid var(--line);
  transition:opacity .5s;
}
.fish{
  position:absolute;left:0;top:0;will-change:transform;cursor:pointer;
  touch-action:manipulation;z-index:2;
}
.fish img{display:block;width:100%;height:auto;pointer-events:none;user-select:none}
/* 墨色濾鏡套在整條魚上（不是逐張圖），身體與尾巴合成後才上光暈，
   否則裁切線會被 drop-shadow 描出一條直邊 */
.fish{--ink:invert(1) brightness(1.5) drop-shadow(0 0 10px rgba(150,235,222,.28));
      --soft: ;filter:var(--ink) var(--soft)}
/* 尾巴擺動：
   body 裁到尾柄稍後方為止；尾巴放在一個「不旋轉」的外層裡，切線固定成垂直，
   只有裡面的圖繞尾柄轉。兩層在尾柄前後各留一點全不透明的重疊，接縫就看不出來。
   外層做成 2 倍高，尾巴甩出魚身範圍時才不會被切掉。 */
.fish .tailwrap{position:absolute;left:0;top:-100%;width:100%;height:300%;
  display:block;pointer-events:none}
.fish .tailrot{position:absolute;left:0;top:33.333%;width:100%;height:33.333%;
  display:block;will-change:transform}
.fish .tailrot img{position:absolute;left:0;top:0;width:100%;height:100%}
.fish.far{opacity:.45;--soft:blur(1.3px)}
.fish.mid{opacity:.72;--soft:blur(.35px)}
.fish::after{content:"";position:absolute;inset:-14px;border-radius:50%}
.fish.dim{opacity:0;transition:opacity .7s ease}
.fish.hot{--ink:invert(1) brightness(1.7) drop-shadow(0 0 16px rgba(190,255,244,.9))}
.fish.rush{transition:transform .95s cubic-bezier(.6,0,.2,1),opacity .35s .75s;z-index:20;opacity:1!important}
.fish.rush{--ink:invert(1) brightness(1.7) drop-shadow(0 0 22px rgba(190,255,244,.85))}
.fish.rush.gone{opacity:0!important}

/* ---- 劍旗魚專屬：集中線 + 卡片劇震 ---- */
.burst{
  position:absolute;inset:0;z-index:22;opacity:0;pointer-events:none;overflow:hidden;
}
.burst i{
  position:absolute;inset:-18%;display:block;transform:scale(1.7);
  background:center 44%/cover no-repeat;   /* 圖由 JS 指定，見 BURST_SRC */
}
.burst.on{animation:burstFade 1.15s ease-out forwards}
.burst.on i{
  animation:burstZoom 1.15s cubic-bezier(.12,.85,.25,1) forwards,
            burstBreathe 7s 1.15s ease-in-out infinite alternate;
}
@keyframes burstFade{0%{opacity:0}4%{opacity:1}34%{opacity:.92}100%{opacity:.3}}
@keyframes burstZoom{
  0%{transform:scale(1.75) rotate(-1.6deg)}
  8%{transform:scale(1) rotate(0deg)}
  22%{transform:scale(1.11)}
  42%{transform:scale(1.01)}
  100%{transform:scale(1.06)}
}
@keyframes burstBreathe{from{transform:scale(1.06)}to{transform:scale(1.13)}}

.card.quake{transition:none;opacity:1;animation:quake 1s cubic-bezier(.3,.7,.4,1) both}
@keyframes quake{
  0%  {transform:translate(-50%,-50%) scale(1.2) rotate(0deg)}
  5%  {transform:translate(calc(-50% + 20px),calc(-50% - 15px)) scale(1.13) rotate(4deg)}
  11% {transform:translate(calc(-50% - 22px),calc(-50% + 12px)) scale(1.1) rotate(-4.5deg)}
  17% {transform:translate(calc(-50% + 17px),calc(-50% + 16px)) scale(1.08) rotate(3.4deg)}
  24% {transform:translate(calc(-50% - 15px),calc(-50% - 11px)) scale(1.06) rotate(-3deg)}
  31% {transform:translate(calc(-50% + 12px),calc(-50% - 13px)) scale(1.05) rotate(2.4deg)}
  39% {transform:translate(calc(-50% - 11px),calc(-50% + 9px)) scale(1.04) rotate(-2deg)}
  47% {transform:translate(calc(-50% + 8px),calc(-50% + 8px)) scale(1.03) rotate(1.5deg)}
  56% {transform:translate(calc(-50% - 6px),calc(-50% - 6px)) scale(1.02) rotate(-1.1deg)}
  65% {transform:translate(calc(-50% + 4px),calc(-50% - 4px)) scale(1.015) rotate(.8deg)}
  75% {transform:translate(calc(-50% - 3px),calc(-50% + 3px)) scale(1.01) rotate(-.5deg)}
  85% {transform:translate(calc(-50% + 2px),calc(-50% - 1px)) scale(1.005) rotate(.25deg)}
  100%{transform:translate(-50%,-50%) scale(1) rotate(0deg)}
}

/* ---- reveal card ---- */
.card{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-46%) scale(.82);
  width:min(78vw,26rem);opacity:0;pointer-events:none;z-index:24;
  background:#fdfbf6;border-radius:14px;padding:10px;
  box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
  transition:opacity .55s ease,transform .7s cubic-bezier(.2,.9,.3,1.1);
}
.card.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.card img{display:block;width:100%;height:auto;border-radius:8px}

/* ---- message ---- */
.msg{
  position:absolute;left:50%;bottom:clamp(90px,16vh,150px);transform:translate(-50%,14px);
  width:min(86vw,34rem);text-align:center;opacity:0;pointer-events:none;
  transition:opacity .8s ease,transform .8s cubic-bezier(.2,.9,.3,1);z-index:25;
}
.msg.on{opacity:1;transform:translate(-50%,0)}
.msg p{font-family:var(--serif);font-weight:700;font-size:clamp(1.25rem,5.4vw,2rem);line-height:1.65;letter-spacing:.03em;color:var(--ink)}
.msg .fam{margin-top:.9rem;font-size:.78rem;letter-spacing:.2em;color:var(--sub)}
.acts{
  position:absolute;left:50%;transform:translateX(-50%);bottom:max(24px,env(safe-area-inset-bottom));
  display:flex;gap:.7rem;opacity:0;pointer-events:none;transition:opacity .6s .3s;z-index:26;
}
.acts.on{opacity:1;pointer-events:auto}
.acts button{
  font:inherit;font-size:.92rem;letter-spacing:.06em;padding:.85rem 1.3rem;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);cursor:pointer;
  backdrop-filter:blur(6px);
  min-height:46px;transition:background .2s,transform .2s;
}
.acts button:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.acts button.ghost{background:transparent}
.acts button:focus-visible{outline:2px solid var(--deep);outline-offset:2px}

.midi{
  position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));
  z-index:40;display:flex;align-items:center;gap:.5rem;
  font-size:.76rem;letter-spacing:.1em;color:var(--sub);
}
.midi button{
  font:inherit;letter-spacing:.1em;padding:.6rem .95rem;border-radius:999px;min-height:40px;
  border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);cursor:pointer;
  backdrop-filter:blur(6px);
}
.midi button:hover{background:rgba(255,255,255,.18)}
.midi .dot{width:8px;height:8px;border-radius:50%;background:#3a5a58;transition:background .3s}
.midi.live .dot{background:#5fe1d1;box-shadow:0 0 0 4px rgba(95,225,209,.2)}
.midi span{opacity:.85}
.fish.hit{--ink:invert(1) brightness(1.8) drop-shadow(0 0 22px rgba(255,255,255,1))}

.musicToggle{
  position:fixed;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));
  z-index:50;font-size:.8rem;letter-spacing:.08em;padding:.55rem .9rem;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--ink);cursor:pointer;min-height:40px;
  transition:opacity .3s,background .2s;
}
.musicToggle.off{opacity:.55}
.musicToggle:hover{background:#fff}
.veil{position:fixed;inset:0;background:var(--foam);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.veil.on{opacity:1}
@media (prefers-reduced-motion:reduce){
  .fish.rush{transition-duration:.4s}
  .mood{transition:none}
  .card.quake{animation:none;transition:opacity .4s ease}
  .burst.on{animation:none;opacity:.28}
  .burst.on i{animation:none;transform:scale(1.04)}
}
</style>
</head>
<body class="loading">
<button class="musicToggle" id="musicToggle" type="button">🔊 深海音樂</button>
<div class="ambience" aria-hidden="true">
  <div class="rays" id="rays"></div>
  <div class="currents" id="currents"></div>
  <div class="bubbles" id="bubbles"></div>
</div>
<div class="stage">

  <section id="home" class="page on">
    <div class="home-in">
      <h1 class="ask">今天的你是哪一種心情？</h1>
      <p class="sub">選一個，然後去海裡撈一句話</p>
      <div class="moods" id="moods">
        <button class="mood" type="button" aria-label="心情 😆">😆</button>
        <button class="mood" type="button" aria-label="心情 🤬">🤬</button>
        <button class="mood" type="button" aria-label="心情 😭">😭</button>
        <button class="mood" type="button" aria-label="心情 😑">😑</button>
      </div>
      <p class="loadnote" id="loadnote">魚群載入中…</p>
      <script>
      /* 主程式還在下載時先記住使用者點了哪個心情，載到後補送出去，
         避免「按鈕看得到卻按不動」的空窗 */
      window.__earlyPick = null;
      document.querySelectorAll("#moods .mood").forEach(function(b,i){
        b.addEventListener("click", function(){
          if(window.__earlyPick === null) window.__earlyPick = i;
        });
      });
      </script>
    </div>
  </section>

  <section id="scene" class="page">
    <p class="hint" id="hint">點一條游過來的魚</p>
    <div id="school"></div>
    <div class="burst" id="burst" aria-hidden="true"><i></i></div>
    <figure class="card" id="card"><img id="cardImg" alt=""></figure>
    <div class="msg" id="msg"><div class="fam" id="msgFam"></div></div>
    <div class="acts" id="acts">
      <button id="again">再選一條魚</button>
      <button id="reset" class="ghost">重新選擇心情</button>
    </div>
  </section>

</div>
<div class="midi" id="midi">
  <span class="dot"></span>
  <button id="midiBtn" type="button">連接 nanoPAD2</button>
  <span id="midiMsg"></span>
</div>
<div class="veil" id="veil"></div>

<script>
/* 大型素材（音樂、魚圖、集中線）移到檔案最後面單獨的 script，
   這一段只有程式邏輯，瀏覽器收到就能跑，首頁不必等素材下載完。 */
const fishes = [];
let MUSIC_SRC = "", BURST_SRC = "";
let assetsReady = false, pendingMood = null, FULLS = null, pendingCard = null;

window.__loadFish = function(list){
  for(const f of list) fishes.push(f);
  assetsReady = true;
  document.body.classList.remove("loading");
  if(pendingMood){ const m = pendingMood; pendingMood = null; pickMood(m); }
};
window.__loadMedia = function(music, burst, fulls){
  MUSIC_SRC = music; BURST_SRC = burst; FULLS = fulls;
  if(pendingCard){ $("cardImg").src = FULLS[pendingCard]; pendingCard = null; }
  const layer = document.querySelector("#burst i");
  if(layer) layer.style.backgroundImage = `url(${BURST_SRC})`;
};

// 集中線只在進入海裡時才解碼：開頁時做會跟魚群搶資源，而且沒點劍旗魚根本用不到
let burstPrimed = false;
function primeBurst(){
  if(burstPrimed || !BURST_SRC) return;
  burstPrimed = true;
  const pre = new Image();
  pre.src = BURST_SRC;
  if(pre.decode) pre.decode().catch(()=>{});
}

const MOODS = [
  {emoji:"😆", tint:"#142a1c"},
  {emoji:"🤬", tint:"#2a1013"},
  {emoji:"😭", tint:"#0b1d34"},
  {emoji:"😑", tint:"#12181c"}
];

const state = {
  currentPage:"home",   // home | scene
  selectedEmotion:null,
  selectedFish:null,
  isSelecting:false,
  showMessage:false
};

const $ = id => document.getElementById(id);
const school = $("school"), veil = $("veil");
let nodes = [], raf = null, W = 0, H = 0;

/* --- home --- */
// 按鈕已經寫在 HTML 裡（不等 JS 就看得到），這裡只接上事件
document.querySelectorAll("#moods .mood").forEach((b,i)=>{
  b.onclick = ()=> pickMood(MOODS[i]);
});
if(window.__earlyPick !== null && window.__earlyPick !== undefined){
  const i = window.__earlyPick;
  window.__earlyPick = undefined;          // 之後的點擊走正常的 onclick
  pickMood(MOODS[i]);
}else{
  window.__earlyPick = undefined;
}

function pickMood(m){
  if(!assetsReady){                       // 魚圖還沒到：記住選擇，到齊後自動繼續
    pendingMood = m;
    $("loadnote").textContent = "馬上就好…";
    return;
  }
  state.selectedEmotion = m.emoji;
  document.body.style.setProperty("--tint", m.tint);
  primeBurst();
  transition(()=>{ show("scene"); startSchool(); });
}

function transition(fn){
  veil.classList.add("on");
  setTimeout(()=>{ fn(); veil.classList.remove("on"); }, 460);
}

function show(page){
  state.currentPage = page;
  $("home").classList.toggle("on", page==="home");
  $("scene").classList.toggle("on", page==="scene");
}

/* --- school of fish --- */
function measure(){ W = window.innerWidth; H = window.innerHeight; }

function baseSize(){ return Math.min(Math.max(W*0.20,80), 190, H*0.22); }   // 也看畫面高度，矮螢幕魚小一點才有閃避空間

/*
   魚是自由亂游的：左右巡航，上下各自漫遊，沒有固定泳道。
   不重疊靠兩層：
   (1) 預判閃避 —— 每一幀算一次 LOOK 秒後的位置，若屆時會擠進彼此的
       安全範圍，就先施力把彼此推開，越接近推得越急，看起來是提早側身讓路。
   (2) 保險分離 —— 萬一還是貼上了（畫面太擠時），再沿著最短方向把兩條
       魚分開幾個 px，數值很小所以看不出來，但保證絕不重疊。
*/
const LOOK  = 0.55;   // 預判幾秒後的位置
const PADX  = 30;     // 左右安全距離
const PADY  = 18;     // 上下安全距離
const FORCE = 1500;   // 閃避推力
const MAXVY = 210;    // 上下閃避速度上限
const TILT  = 16;     // 閃避時最大擺頭角度

/*
   找「尾柄」：魚身最細的那一節，尾巴就從那裡擺。
   只在離頭 60%~80% 的區間裡找（＝尾巴佔全長的 1/5 ~ 2/5），
   這樣長吻的劍旗魚不會被從身體中段切開，短胖的魚也不會只擺到一點點尾鰭。
   每張圖只算一次，結果存起來重複用。
*/
/* 尾柄位置、體軸等圖形分析結果在打包時就先算好存在這裡。
   好處有二：開頁時省掉 17 次 canvas 掃描；而且素材改成外部檔案、
   用 file:// 直接開時 canvas 會被瀏覽器判定跨來源而讀不到像素，
   有這張表就不受影響。表裡沒有的才回頭即時分析。 */
const PRECOMPUTED = {"1|1":{"joints":[{"j":0.78,"cy":0.5339}],"narrow":0.44,"axis":0.4915},"2|1":{"joints":[{"j":0.7867,"cy":0.4507}],"narrow":0.309,"axis":0.493},"3|1":{"joints":[{"j":0.7067,"cy":0.5062}],"narrow":0.177,"axis":0.5},"4|1":{"joints":[{"j":0.7667,"cy":0.4792}],"narrow":0.561,"axis":0.4896},"5|1":{"joints":[{"j":0.7733,"cy":0.5769}],"narrow":0.271,"axis":0.4808},"6|1":{"joints":[{"j":0.7867,"cy":0.5268}],"narrow":0.333,"axis":0.4911},"7|1":{"joints":[{"j":0.72,"cy":0.3833}],"narrow":0.169,"axis":0.525},"8|3":{"joints":[{"j":0.7267,"cy":0.4946},{"j":0.8133,"cy":0.5},{"j":0.9,"cy":0.4946}],"narrow":0.122,"axis":0.4946},"9|prof":{"axis":0.5},"10|3":{"joints":[{"j":0.7,"cy":0.5253},{"j":0.7933,"cy":0.5316},{"j":0.8867,"cy":0.5443}],"narrow":0.104,"axis":0.4937},"11|1":{"joints":[{"j":0.7867,"cy":0.3929}],"narrow":0.35,"axis":0.4881},"12|1":{"joints":[{"j":0.7867,"cy":0.4024}],"narrow":0.19,"axis":0.4939},"13|1":{"joints":[{"j":0.7867,"cy":0.4861}],"narrow":0.706,"axis":0.4861},"14|1":{"joints":[{"j":0.6867,"cy":0.4773}],"narrow":0.583,"axis":0.4955},"15|1":{"joints":[{"j":0.78,"cy":0.4012}],"narrow":0.469,"axis":0.4938},"16|1":{"joints":[{"j":0.7333,"cy":0.4679}],"narrow":0.216,"axis":0.4936},"17|1":{"joints":[{"j":0.7667,"cy":0.4592}],"narrow":0.222,"axis":0.4898}};

const TAIL_PAD = 0.035;                 // 接縫前後各留一點重疊，轉起來才看不出切線
const shapeCache = new Map();

/* 掃出每一欄墨跡的上下緣，找尾柄與體軸都靠它 */
function profileOf(img){
  const CW = 150, CH = Math.max(1, Math.round(img.naturalHeight*CW/img.naturalWidth));
  const cv = document.createElement("canvas"); cv.width=CW; cv.height=CH;
  const ctx = cv.getContext("2d", {willReadFrequently:true});
  ctx.drawImage(img, 0, 0, CW, CH);
  let d;
  try { d = ctx.getImageData(0,0,CW,CH).data; } catch(e){ return null; }

  const top=new Int16Array(CW).fill(-1), bot=new Int16Array(CW).fill(-1);
  for(let x=0;x<CW;x++){
    for(let y=0;y<CH;y++){
      if(d[(y*CW+x)*4+3] > 20){ if(top[x]<0) top[x]=y; bot[x]=y; }
    }
  }
  let x0=0;      while(x0<CW && top[x0]<0) x0++;
  let x1=CW-1;   while(x1>x0 && top[x1]<0) x1--;
  if(x1-x0 < 12) return null;

  let maxThick=0, yTop=CH, yBot=0;
  for(let x=x0;x<=x1;x++){
    if(top[x]<0) continue;
    maxThick = Math.max(maxThick, bot[x]-top[x]+1);
    yTop = Math.min(yTop, top[x]); yBot = Math.max(yBot, bot[x]);
  }
  return {top, bot, x0, x1, CW, CH, maxThick, axis:(yTop+yBot)/2/CH};
}

/* 關節位置：第一個＝離頭 60~80% 之間最細處（尾柄），
   其餘沿著尾巴平均往尾端排，節數越多彎得越柔順 */
function jointsOf(img, faceRight, segs){
  const pr = profileOf(img);
  if(!pr) return null;
  const {top, bot, x0, x1, CW, CH, maxThick} = pr;
  const len = x1-x0;

  let first=null;
  for(let t=0.60; t<=0.80; t+=0.5/len){
    const x = Math.round(faceRight ? x1 - t*len : x0 + t*len);
    if(x<0 || x>=CW || top[x]<0) continue;
    const thick = bot[x]-top[x]+1;
    if(!first || thick < first.thick) first={thick, x, t};
  }
  if(!first || !maxThick) return null;

  const joints=[], tipT=0.99;
  for(let k=0;k<segs;k++){
    const t = first.t + (tipT-first.t)*k/segs;
    const x = Math.max(0, Math.min(CW-1, Math.round(faceRight ? x1 - t*len : x0 + t*len)));
    joints.push({ j:x/CW, cy: top[x]>=0 ? (top[x]+bot[x])/2/CH : pr.axis });
  }
  return { joints, narrow:first.thick/maxThick, axis:pr.axis };
}

/*
   三種擺動方式，由資料的 motion 欄位決定：
     "wag"（預設）— 側視魚：尾柄單一關節左右擺
     "whip"        — 蝙蝠魚、鰩：細長鞭尾，分三節逐節帶相位差，甩成行進波
     "flap"        — 俯視的魟：沒有尾可擺，改成繞體軸收合翼面＝從上往下看的拍翼
*/
function setupMotion(o, img){
  if(!img.naturalWidth || o.motionReady) return;
  o.motionReady = true;
  const mode = o.data.motion || "wag";
  if(mode === "none") return;
  const faceRight = o.face === 1;
  const gain = (o.data.wag === undefined ? 1 : o.data.wag);
  if(gain <= 0) return;
  const pct = v => (Math.max(0, Math.min(1, v))*100).toFixed(2)+"%";

  if(mode === "flap"){
    const key = o.data.id+"|prof";
    if(!shapeCache.has(key)) shapeCache.set(key, PRECOMPUTED[key] || profileOf(img));
    const pr = shapeCache.get(key);
    if(!pr) return;
    // 繞體軸做垂直收合：離軸越遠動得越多，所以翼端擺幅最大、身體幾乎不動
    img.style.transformOrigin = `50% ${pct(pr.axis)}`;
    o.flapImg   = img;
    o.flapAmp   = 0.17 * gain;
    o.flapRate  = 1.9 + o.cruise*0.010;
    o.flapPhase = Math.random()*Math.PI*2;
    return;
  }

  const segs = (mode === "whip") ? 3 : 1;
  const key = o.data.id+"|"+segs;
  if(!shapeCache.has(key)) shapeCache.set(key, PRECOMPUTED[key] || jointsOf(img, faceRight, segs));
  const info = shapeCache.get(key);
  // 單關節模式下，魚身到尾巴幾乎一樣粗（鰻狀）就沒有尾柄可轉，硬轉會像折斷
  if(!info || (segs === 1 && info.narrow > 0.62)) return;

  const p = TAIL_PAD, J = info.joints;
  // 身體留到第一個關節稍後方
  img.style.clipPath = faceRight ? `inset(0 0 0 ${pct(J[0].j-p)})`
                                 : `inset(0 ${pct(1-(J[0].j+p))} 0 0)`;

  // 一節一節往尾端疊：wrap 負責裁切（不旋轉，切線才跟著上一節的方向走），rot 負責轉
  o.segs = [];
  let host = o.el;
  for(let k=0;k<J.length;k++){
    const a = J[k].j, b = (k+1 < J.length) ? J[k+1].j : null;
    const wrap = document.createElement("span");
    wrap.className = "tailwrap";
    wrap.style.clipPath = faceRight ? `inset(0 ${pct(1-(a+p))} 0 0)`
                                    : `inset(0 0 0 ${pct(a-p)})`;
    const rot = document.createElement("span");
    rot.className = "tailrot";
    rot.style.transformOrigin = `${pct(a)} ${pct(J[k].cy)}`;
    const layer = new Image();
    layer.src = o.data.image; layer.alt = "";
    if(b !== null){                                   // 這一節只畫到下一個關節為止
      layer.style.clipPath = faceRight ? `inset(0 0 0 ${pct(b-p)})`
                                       : `inset(0 ${pct(1-(b+p))} 0 0)`;
    }
    rot.appendChild(layer); wrap.appendChild(rot); host.appendChild(wrap);
    o.segs.push(rot);
    host = rot;                                        // 下一節掛在這一節裡，旋轉才會累加
  }

  o.segAmp = J.map((_,k)=> (segs === 1 ? (5.5 + Math.random()*2.5)
                                       : (3.0 + k*1.3)) * gain);
  o.segLag  = 0.6;                                     // 每節的相位延遲＝行進波
  o.wagRate = 3.2 + o.cruise*0.035;                    // 游越快擺越快
  o.wagPhase = Math.random()*Math.PI*2;
}

// 魚身旋轉後實際佔到的方框
function boxOf(o){
  const r = Math.abs(o.tilt||0)*Math.PI/180, c = Math.cos(r), s = Math.sin(r);
  return { w: o.w*c + o.h*s, h: o.w*s + o.h*c };
}

// 重生時從幾個候選高度裡挑最空的一個，避免一出畫面就跟別人擠在一起
function pickSpawnY(o, nx){
  let best = 10, bestGap = -Infinity;
  for(let k=0;k<7;k++){
    const y = 10 + Math.random()*Math.max(20, H - o.h - 20);
    let gap = Infinity;
    for(const p of nodes){
      if(p===o) continue;
      const gx = Math.abs((nx + o.w/2) - (p.x + p.w/2)) - (o.bw + p.bw)/2;
      const gy = Math.abs((y  + o.h/2) - (p.y + p.h/2)) - (o.bh + p.bh)/2;
      const g = Math.max(gx, gy);          // 兩軸都近才算擠
      if(g < gap) gap = g;
    }
    if(gap > bestGap){ bestGap = gap; best = y; }
  }
  return best;
}

function startSchool(){
  stopSchool();
  measure();
  state.selectedFish=null; state.isSelecting=false; state.showMessage=false;
  $("msg").classList.remove("on"); $("acts").classList.remove("on");
  $("card").classList.remove("on","quake"); $("burst").classList.remove("on");
  $("hint").style.opacity="1";
  school.innerHTML="";

  const SPREAD = W*1.5;   // 出畫後退到多遠重生：拉開間距，畫面上同時不會太擠

  nodes = fishes.map((f,i)=>{
    const el=document.createElement("div");
    el.className="fish"; el.setAttribute("role","button"); el.tabIndex=0;
    el.setAttribute("aria-label","選這條魚");
    const img=new Image(); img.src=f.image; img.alt=""; el.appendChild(img);
    const depth = Math.random();                 // 0 = 最遠, 1 = 最近
    const w = baseSize()*(0.40 + depth*0.88)*(f.scale || 1);
    el.style.width = w+"px";
    el.style.zIndex = String(2+Math.round(depth*12));
    el.classList.add(depth<0.34 ? "far" : depth<0.68 ? "mid" : "near");
    school.appendChild(el);
    const dir = Math.random()<0.5 ? 1 : -1;      // 1 = 往右, -1 = 往左
    const o = {
      el, data:f, dir, depth, w, h: w*0.6, tilt: 0,
      face: f.face || -1,            // 底圖朝向：-1 朝左（多數）, 1 朝右
      cruise: 26 + depth*100 + Math.random()*34, // 左右巡航速度
      vy: 0, vxAdj: 0, ax: 0, ay: 0, threat: 0,
      wa: Math.random()*Math.PI*2,               // 亂游用的兩組相位
      wb: Math.random()*Math.PI*2,
      wfa: 0.30 + Math.random()*0.45,
      wfb: 0.13 + Math.random()*0.22,
      wamp: 12 + Math.random()*26,               // 上下漫遊幅度
      x: 0, y: 0
    };
    const track = W + w + 60 + SPREAD;
    const t0 = Math.random()*track;
    o.x = dir===1 ? t0 - w - 60 - SPREAD : W + 60 + SPREAD - t0;
    o.y = 10 + Math.random()*Math.max(20, H - o.h - 20);
    // 圖載入後取得真實高度，閃避範圍才算得準
    const fit = ()=>{
      if(!img.naturalWidth) return;
      o.h = w*(img.naturalHeight/img.naturalWidth);
      setupMotion(o, img);
    };
    img.addEventListener("load", fit);
    if(img.complete) fit();
    const act = e => { e.preventDefault(); select(o); };
    el.addEventListener("click", act);
    el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" ") act(e); });
    el.addEventListener("pointerenter", ()=>{ if(!state.isSelecting) el.classList.add("hot"); });
    el.addEventListener("pointerleave", ()=> el.classList.remove("hot"));
    return o;
  });

  let last=performance.now();
  const loop = now => {
    const dt=Math.min((now-last)/1000,.05); last=now;
    if(!state.isSelecting){
      const n = nodes.length;

      /* 1. 歸零受力，推進各自的亂游相位，量一下現在佔多大 */
      for(const o of nodes){
        o.ax = 0; o.ay = 0; o.threat = 0;
        o.wa += dt*o.wfa; o.wb += dt*o.wfb;
        // 先用當下的上下速度算出擺頭角度，佔位方框才不會慢一幀
        o.tilt = Math.max(-TILT, Math.min(TILT, Math.atan2(o.vy, o.cruise)*57.2958*0.7));
        const b = boxOf(o); o.bw = b.w; o.bh = b.h;
      }

      /* 2. 預判閃避：看 LOOK 秒後誰會擠到誰 */
      for(let i=0;i<n;i++){
        const a = nodes[i];
        const acx = a.x + a.w/2 + a.dir*a.cruise*LOOK;
        const acy = a.y + a.h/2 + a.vy*LOOK;
        for(let j=i+1;j<n;j++){
          const b = nodes[j];
          const bcx = b.x + b.w/2 + b.dir*b.cruise*LOOK;
          const bcy = b.y + b.h/2 + b.vy*LOOK;
          const rx = (a.bw + b.bw)/2 + PADX;
          const ry = (a.bh + b.bh)/2 + PADY;
          const dx = bcx-acx, dy = bcy-acy;
          const ox = rx - Math.abs(dx), oy = ry - Math.abs(dy);
          if(ox <= 0 || oy <= 0) continue;            // 屆時錯得開，不必閃
          const s = Math.min(ox/rx, oy/ry);           // 0→剛好擦邊, 1→完全疊上
          let ux = dx/rx, uy = dy/ry;
          let d = Math.sqrt(ux*ux + uy*uy);
          if(d < 1e-4){ ux = 0; uy = (i+j)%2 ? 1 : -1; d = 1; }
          const f = s*FORCE, nx = ux/d, ny = uy/d;
          a.ay -= ny*f;       b.ay += ny*f;           // 主要往上下讓開
          a.ax -= nx*f*0.28;  b.ax += nx*f*0.28;      // 順帶一點加減速
          if(s > a.threat) a.threat = s;
          if(s > b.threat) b.threat = s;
        }
      }

      /* 3. 積分：亂游 + 閃避 + 上下邊界 + 出畫重生 */
      for(const o of nodes){
        // 亂游節奏；正在閃避時讓位給閃避力
        const wander = (Math.sin(o.wa)*0.62 + Math.sin(o.wb*1.7+1.3)*0.38) * o.wamp;
        o.ay += (wander - o.vy)*1.7*(1 - Math.min(1, o.threat*1.4));

        const topLim = 4, botLim = Math.max(topLim, H - o.bh - 4);
        if(o.y < topLim) o.ay += (topLim - o.y)*14;   // 貼到上下緣就被水推回來
        if(o.y > botLim) o.ay -= (o.y - botLim)*14;

        o.vy = Math.max(-MAXVY, Math.min(MAXVY, o.vy + o.ay*dt));
        o.y += o.vy*dt;

        o.vxAdj = Math.max(-80, Math.min(80, (o.vxAdj + o.ax*dt) * Math.pow(0.10, dt)));
        o.x += (o.dir*o.cruise + o.vxAdj)*dt;

        if(o.dir===1 && o.x > W + o.w + 20){
          o.x = -o.w - 60 - Math.random()*SPREAD;
          o.y = pickSpawnY(o, o.x); o.vy = 0;
        }
        if(o.dir===-1 && o.x < -o.w - 20){
          o.x = W + 60 + Math.random()*SPREAD;
          o.y = pickSpawnY(o, o.x); o.vy = 0;
        }
      }

      /* 4. 保險分離：真的貼上了就沿最短方向推開，位移很小看不出來 */
      for(let pass=0; pass<5; pass++){
        let clean = true;
        for(let i=0;i<n;i++){
          const a = nodes[i];
          const acx = a.x + a.w/2, acy = a.y + a.h/2;
          for(let j=i+1;j<n;j++){
            const b = nodes[j];
            const dx = (b.x + b.w/2) - acx, dy = (b.y + b.h/2) - acy;
            const ox = (a.bw + b.bw)/2 + 3 - Math.abs(dx);
            const oy = (a.bh + b.bh)/2 + 3 - Math.abs(dy);
            if(ox <= 0 || oy <= 0) continue;
            clean = false;
            if(oy <= ox){                              // 上下推開比較近
              const s = (dy < 0 ? -1 : 1) * Math.min(oy/2, 9);
              a.y -= s; b.y += s;
              if(a.vy*s > 0) a.vy *= 0.5;
              if(b.vy*s < 0) b.vy *= 0.5;
            }else{                                     // 左右推開比較近
              const s = (dx < 0 ? -1 : 1) * Math.min(ox/2, 9);
              a.x -= s; b.x += s;
            }
          }
        }
        if(clean) break;
      }

      /* 5. 畫出來：閃避時魚身順著上下動向擺頭，像真的在讓路 */
      for(const o of nodes){
        o.el.style.transform = `translate3d(${o.x}px,${o.y}px,0) scaleX(${o.dir===o.face?1:-1}) rotate(${-o.tilt}deg)`;
        if(o.segs){                       // 尾巴：逐節帶相位差，多節時就成了行進波
          o.wagPhase += dt*o.wagRate;
          for(let k=0;k<o.segs.length;k++){
            const ang = o.segAmp[k]*Math.sin(o.wagPhase - k*o.segLag);
            o.segs[k].style.transform = `rotate(${ang.toFixed(2)}deg)`;
          }
        }else if(o.flapImg){              // 魟：繞體軸收合翼面
          o.flapPhase += dt*o.flapRate;
          const s = 1 - o.flapAmp*(0.5 - 0.5*Math.cos(o.flapPhase));
          o.flapImg.style.transform = `scaleY(${s.toFixed(3)})`;
        }
      }
    }
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}

function stopSchool(){ if(raf) cancelAnimationFrame(raf); raf=null; }

/* --- select one fish --- */
function select(o, vel){
  if(state.isSelecting) return;
  if(vel){ o.el.style.transitionDuration = (1.15 - vel*0.55).toFixed(2)+"s"; }
  state.isSelecting = true;
  state.selectedFish = o.data.id;
  $("hint").style.opacity="0";

  nodes.forEach(n=>{ if(n!==o){ n.el.classList.add("dim"); n.el.style.pointerEvents="none"; } });
  o.el.classList.remove("hot","far","mid");

  const h = o.el.offsetHeight || o.w*0.6;
  const ratio = h / o.w;                                   // 縱長的魚（例如魟）也要放得下
  const target = Math.min(W*0.86, 560, (H*0.5)/Math.max(ratio, 0.5));
  const scale = target / o.w;
  const cx = W/2 - o.w/2;
  const cy = H*0.44 - h/2;

  requestAnimationFrame(()=>{
    o.el.classList.add("rush");
    o.el.style.transform = `translate3d(${cx}px,${cy}px,0) scaleX(${o.dir===o.face?1:-1}) scale(${scale}) rotate(-1.5deg)`;
  });

  const selectedFishData = fishes.find(f => f.id === state.selectedFish);
  setTimeout(()=>{
    o.el.classList.add("gone");
    state.showMessage = true;
    // 卡片大圖是最後才到的素材；還沒到就先記著，到了再補上
    if(FULLS && FULLS[selectedFishData.id]) $("cardImg").src = FULLS[selectedFishData.id];
    else pendingCard = selectedFishData.id;
    $("cardImg").alt = selectedFishData.message;
    $("msgFam").textContent = selectedFishData.family;
    $("card").classList.add("on");
    if(selectedFishData.fx === "clash"){        // 劍旗魚：集中線 + 卡片劇震
      $("card").classList.add("quake");
      $("burst").classList.add("on");
    }
    $("msg").classList.add("on");
    $("acts").classList.add("on");
  }, 820);
}

/* --- actions --- */
$("again").onclick = ()=> transition(()=> startSchool());
$("reset").onclick = ()=> transition(()=>{
  stopSchool(); school.innerHTML="";
  state.selectedEmotion=null; state.selectedFish=null;
  state.isSelecting=false; state.showMessage=false;
  $("msg").classList.remove("on"); $("acts").classList.remove("on");
  $("card").classList.remove("on","quake"); $("burst").classList.remove("on");
  document.body.style.setProperty("--tint","#020c10");
  show("home");
});

/* --- MIDI: KORG nanoPAD2 --- */
const midi = { on:false, device:null };
const midiBox = $("midi"), midiMsg = $("midiMsg");

function midiStatus(text, live){
  midiMsg.textContent = text;
  midiBox.classList.toggle("live", !!live);
}

$("midiBtn").onclick = ()=>{
  if(!navigator.requestMIDIAccess){ midiStatus("這個瀏覽器不支援 Web MIDI，改用 Chrome 或 Edge"); return; }
  navigator.requestMIDIAccess().then(access=>{
    const bind = ()=>{
      let found = null;
      for(const input of access.inputs.values()){ input.onmidimessage = onMidi; found = input.name; }
      midi.on = !!found; midi.device = found;
      midiStatus(found ? found : "沒有偵測到裝置，接上後會自動連線", !!found);
    };
    access.onstatechange = bind;
    bind();
    $("midiBtn").textContent = "MIDI";
  }).catch(()=> midiStatus("MIDI 權限被拒，請在網址列的權限設定裡允許"));
};

function onMidi(e){
  const [status, note, velocity] = e.data;
  if((status & 0xf0) !== 0x90 || velocity === 0) return;   // 只收 note on
  hitPad(note, velocity/127);
}

function hitPad(note, vel){
  if(state.currentPage === "home"){ pickMood(MOODS[note % MOODS.length]); return; }
  if(!fishes.length) return;
  if(state.showMessage){ transition(()=> startSchool()); return; }   // 顯示文字時：再撈一條
  if(state.isSelecting || !nodes.length) return;
  const wanted = fishes[note % fishes.length].id;
  const o = nodes.find(n => n.data.id === wanted);
  if(!o) return;
  o.el.classList.add("hit");
  select(o, vel);
}

// 沒有 MIDI 裝置時：鍵盤 1234qwer asdf zxcv b 對應 17 條魚
const KEYS = "1234qwerasdfzxcvb";
window.addEventListener("keydown", e=>{
  const i = KEYS.indexOf(e.key.toLowerCase());
  if(i >= 0) hitPad(i, 0.8);
});

/* --- 深海環境音樂：內嵌音檔，本機播放不外抓 --- */
const music = { el:null, on:true, started:false, target:0.5 };
const musicBtn = $("musicToggle");

function startMusic(){
  if(music.started || !MUSIC_SRC) return;   // 音樂是最後才到的素材
  music.started = true;
  const el = new Audio(MUSIC_SRC);
  el.loop = true; el.preload = "auto"; el.volume = 0;
  music.el = el;
  el.play().catch(()=>{ music.started = false; });
  const t0 = performance.now();
  const fadeIn = ()=>{
    const p = Math.min(1, (performance.now()-t0)/3500);
    el.volume = (music.on ? music.target : 0) * p;
    if(p < 1) requestAnimationFrame(fadeIn);
  };
  requestAnimationFrame(fadeIn);
}

function setMusicOn(on){
  music.on = on;
  musicBtn.classList.toggle("off", !on);
  musicBtn.textContent = on ? "🔊 深海音樂" : "🔈 深海音樂";
  if(!music.el) return;
  const from = music.el.volume, to = on ? music.target : 0, t0 = performance.now();
  const step = ()=>{
    const p = Math.min(1, (performance.now()-t0)/600);
    music.el.volume = from + (to-from)*p;
    if(p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

musicBtn.onclick = ()=>{
  if(!music.started) startMusic();
  else setMusicOn(!music.on);
};
// 使用者在任何地方第一次點擊／按鍵，就順手把音樂啟動起來（瀏覽器要求要有互動才能發聲）
window.addEventListener("pointerdown", ()=>{ if(!music.started) startMusic(); }, { once:true });
window.addEventListener("keydown", ()=>{ if(!music.started) startMusic(); }, { once:true });

/* --- 深海環境層：光束、水流、氣泡 --- */
function initAmbience(){
  const rays = $("rays");
  for(let i=0;i<4;i++){
    const r = document.createElement("div"); r.className="ray";
    r.style.left = (6 + i*24 + Math.random()*10) + "%";
    r.style.setProperty("--rot1", (Math.random()*10-8)+"deg");
    r.style.setProperty("--rot2", (Math.random()*10-2)+"deg");
    r.style.animationDuration = (12 + Math.random()*10)+"s";
    r.style.animationDelay = (-Math.random()*12)+"s";
    rays.appendChild(r);
  }
  const currents = $("currents");
  for(let i=0;i<3;i++){
    const c = document.createElement("div"); c.className="current";
    const size = 42 + Math.random()*30;
    c.style.width = size+"vw"; c.style.height = size+"vw";
    c.style.left = (Math.random()*80-12)+"%";
    c.style.top = (8 + Math.random()*74)+"%";
    c.style.animationDuration = (32 + Math.random()*22)+"s";
    c.style.animationDelay = (-Math.random()*24)+"s";
    currents.appendChild(c);
  }
  const bubbles = $("bubbles");
  for(let i=0;i<26;i++){
    const b = document.createElement("div"); b.className="bubble";
    const size = 4 + Math.random()*20;
    b.style.width = size+"px"; b.style.height = size+"px";
    b.style.left = Math.random()*100+"%";
    b.style.setProperty("--sway", (Math.random()*60-30)+"px");
    const dur = 9 + Math.random()*14;
    b.style.animationDuration = dur+"s";
    b.style.animationDelay = (-Math.random()*dur)+"s";
    bubbles.appendChild(b);
  }
}
initAmbience();

let rt;
window.addEventListener("resize", ()=>{
  clearTimeout(rt);
  rt = setTimeout(()=>{ if(state.currentPage==="scene" && !state.isSelecting) startSchool(); else measure(); }, 200);
});
measure();
</script>
